name: Build HfpVoipLab
on:
  push:
    branches: [main]
    paths: ['app/**', 'tools/**', 'tests/**', '.github/workflows/build-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install platform and compile-only API
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-30' 'build-tools;35.0.0'
          curl --fail --location --retry 3 https://api.xposed.info/de/robv/android/xposed/api/82/api-82.jar -o "$RUNNER_TEMP/xposed.jar"
          echo "f48c635f1c7469fdec0e00ad2ea0b7a6b2f5b55065784a35b7ca3a84615e8e25  $RUNNER_TEMP/xposed.jar" | sha256sum -c -
      - name: Host safety tests
        run: |
          python3 tests/hook_safety_test.py
          mkdir -p build-tests
          javac -encoding UTF-8 -d build-tests app/src/main/java/com/hfpvoipfix/ReportArchive.java tests/ReportArchiveTest.java
          java -cp build-tests com.hfpvoipfix.ReportArchiveTest
          javac -encoding UTF-8 -d build-tests app/src/main/java/com/hfpvoipfix/FirmwareArchive.java tests/FirmwareArchiveTest.java
          java -cp build-tests com.hfpvoipfix.FirmwareArchiveTest
          javac -encoding UTF-8 -d build-tests app/src/main/java/com/hfpvoipfix/HciMetadata.java tests/HciMetadataTest.java
          java -cp build-tests com.hfpvoipfix.HciMetadataTest
          javac -encoding UTF-8 -d build-tests app/src/main/java/com/hfpvoipfix/LabModes.java app/src/main/java/com/hfpvoipfix/RxGate.java tests/RxGateTest.java
          java -cp build-tests com.hfpvoipfix/RxGateTest
          javac -encoding UTF-8 -d build-tests app/src/main/java/com/hfpvoipfix/ProbeChannel.java tests/ProbeChannelTest.java
          java -cp build-tests com.hfpvoipfix.ProbeChannelTest
          javac -encoding UTF-8 -d build-tests app/src/main/java/com/hfpvoipfix/CallCommand.java tests/CallCommandTest.java
          java -cp build-tests com.hfpvoipfix.CallCommandTest
      - name: Build with stable signing identity when configured
        env:
          KEYSTORE_B64: ${{ secrets.HFPLAB_KEYSTORE_B64 }}
          LAB_KEYSTORE_PASSWORD: ${{ secrets.HFPLAB_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          export ANDROID_PLATFORM_JAR="$ANDROID_SDK_ROOT/platforms/android-30/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          export XPOSED_API_JAR="$RUNNER_TEMP/xposed.jar"
          if [[ -n "$KEYSTORE_B64" && -n "$LAB_KEYSTORE_PASSWORD" ]]; then
            umask 077
            export LAB_KEYSTORE="$RUNNER_TEMP/hfplab.p12"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$LAB_KEYSTORE"
          fi
          bash tools/build-lab.sh
          if [[ -n "${LAB_KEYSTORE:-}" ]]; then rm -f "$LAB_KEYSTORE"; fi
      - name: Signed release
        if: ${{ hashFiles('build-lab/HfpVoipLab-1.7.7.apk') != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: HfpVoipLab-1.7.7-signed
          path: |
            build-lab/HfpVoipLab-1.7.7.apk
            build-lab/signature.txt
            build-lab/manifest.txt
          if-no-files-found: error
      - name: Explain missing signing identity
        if: ${{ hashFiles('build-lab/HfpVoipLab-1.7.7.apk') == '' }}
        run: echo 'Compilation verified. Install the two HFPLAB signing secrets to produce a signed release. No ephemeral key is generated.'
