name: Publish v1.1.1

on:
  push:
    branches: [ main ]
    paths:
      - 'dist/HfpVoipFix-1.1.1-mtk.apk'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace v1.1.0 with v1.1.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release delete v1.1.0 --cleanup-tag -y
          fi

          cat > /tmp/release-notes.md <<'EOF'
          Experimental MediaTek HFP Client build.

          Changes in 1.1.1:
          - custom phone + Bluetooth application icon;
          - versionName 1.1.1 / versionCode 12;
          - same bt_wbs HFP Client hook behavior as 1.1.0;
          - same 1.1.x signing certificate, so 1.1.0 can be updated in place.

          SHA-256:
          a85e5a59c8971e993d90fb7fea36da0f4fef0ba80de3e51c1ff8575cde1fb1db
          EOF

          if gh release view v1.1.1 >/dev/null 2>&1; then
            gh release upload v1.1.1 dist/HfpVoipFix-1.1.1-mtk.apk --clobber
          else
            gh release create v1.1.1 dist/HfpVoipFix-1.1.1-mtk.apk               --title "HfpVoipFix 1.1.1 MTK"               --notes-file /tmp/release-notes.md               --latest
          fi
