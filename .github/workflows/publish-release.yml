name: Publish v1.0.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create v1.0.0 release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; nothing to do."
            exit 0
          fi
          gh release create v1.0.0 dist/HfpVoipFix-1.0.apk \
            --title "HfpVoipFix 1.0.0" \
            --notes "Experimental diagnostic LSPosed module. It forces HFP Client connections to use VoIP audio mode; on the current MT6785 test device this changes Telecom mode but does not yet provide usable call audio." \
            --latest
